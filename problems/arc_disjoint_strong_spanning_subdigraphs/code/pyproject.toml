[project]
name = "sad-verifier"
version = "0.1.0"
description = "Strong arc decomposition verifier for the Bang-Jensen-Yeo conjecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "pulp>=2.7",
    "pynauty>=2.8.8.1",
    "python-sat>=0.1.8.dev16",
]

[project.optional-dependencies]
gurobi = ["gurobipy>=11.0"]
ortools = ["ortools>=9.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
